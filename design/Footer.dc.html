<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F4F3EF; }
  ::selection { background: #111110; color: #F4F3EF; }
</style>
</helmet>
<footer style="--ac: {{ accent }}; font-family: 'Space Grotesk', sans-serif; color: #111110; background: #F4F3EF;">
  <div style="max-width: 1180px; margin: 0 auto; padding: 110px 40px 48px;">



    <a href="mailto:{{ email }}" style="display: inline-block; text-decoration: none; color: #111110; font-weight: 700; font-size: clamp(38px, 7vw, 96px); letter-spacing: -0.045em; line-height: 0.92;" style-hover="color: var(--ac, #1F4DFF);">{{ email }} <span data-arrow="1" style="display: inline-block;">↗</span></a>

    <div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 14px 36px; margin-top: 56px; padding-top: 26px; border-top: 1px solid #111110; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase;">
      <a href="{{ linkedin }}" target="_blank" rel="noreferrer" style="color: #111110; text-decoration: none;" style-hover="color: var(--ac, #1F4DFF);">LinkedIn <span data-arrow="1" style="display: inline-block;">↗</span></a>
      <a href="{{ github }}" target="_blank" rel="noreferrer" style="color: #111110; text-decoration: none;" style-hover="color: var(--ac, #1F4DFF);">GitHub <span data-arrow="1" style="display: inline-block;">↗</span></a>
      <a href="{{ x }}" target="_blank" rel="noreferrer" style="color: #111110; text-decoration: none;" style-hover="color: var(--ac, #1F4DFF);">X <span data-arrow="1" style="display: inline-block;">↗</span></a>
      <a href="{{ resume }}" target="_blank" rel="noreferrer" style="color: #111110; text-decoration: none;" style-hover="color: var(--ac, #1F4DFF);">Résumé <span data-arrow="1" style="display: inline-block;">↗</span></a>
      <span style="margin-left: auto; color: #6F6F68;">{{ copyright }}</span>
    </div>

  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1180, &quot;height&quot;: 420 },
  &quot;accent&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#1F4DFF&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Theme&quot;, &quot;options&quot;: [&quot;#1F4DFF&quot;, &quot;#FF4D17&quot;, &quot;#00B86B&quot;, &quot;#7C3AED&quot;] },
  &quot;kicker&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Get in touch&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Content&quot; },
  &quot;email&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;hi@dawsonash.com&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Links&quot; },
  &quot;linkedin&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;https://linkedin.com/in/dawsonash&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Links&quot; },
  &quot;github&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;https://github.com/dawsonash&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Links&quot; },
  &quot;x&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;https://x.com/dawsonash&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Links&quot; },
  &quot;resume&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;#&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Links&quot; },
  &quot;name&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Dawson Ash&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Content&quot; },
  &quot;year&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;2026&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Content&quot; }
}">
class Component extends DCLogic {
  componentDidMount() { this._wireArrows(); }
  componentDidUpdate() { this._wireArrows(); }

  _wireArrows() {
    document.querySelectorAll('footer [data-arrow]').forEach((arrow) => {
      if (arrow.dataset.wired) return;
      arrow.dataset.wired = '1';
      const a = arrow.closest('a');
      if (!a) return;
      arrow.style.transition = 'transform 0.25s cubic-bezier(0.2,0.8,0.2,1)';
      a.addEventListener('mouseenter', () => { arrow.style.transform = 'translate(3px, -3px)'; });
      a.addEventListener('mouseleave', () => { arrow.style.transform = 'none'; });
    });
  }

  renderVals() {
    const name = this.props.name ?? 'Dawson Ash';
    const year = this.props.year ?? '2026';
    return {
      accent: this.props.accent ?? '#1F4DFF',
      kicker: this.props.kicker ?? 'Get in touch',
      email: this.props.email ?? 'hi@dawsonash.com',
      linkedin: this.props.linkedin ?? 'https://linkedin.com/in/dawsonash',
      github: this.props.github ?? 'https://github.com/dawsonash',
      x: this.props.x ?? 'https://x.com/dawsonash',
      resume: this.props.resume ?? '#',
      copyright: `${year} ${String(name).toUpperCase()}`,
    };
  }
}
</script>
</body>
</html>
